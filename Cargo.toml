[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tools/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/musiverion/musiverion"
publish = false

[workspace.dependencies]
# Internal crates
mv-core = { path = "crates/mv-core" }
mv-app = { path = "crates/mv-app" }

# Shared external dependencies
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
nix = { version = "0.32", default-features = false }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Tests may unwrap/expect: see clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
